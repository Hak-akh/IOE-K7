    <script>
      // Safeguard against environments where window.fetch is getter-only
      (function() {
        try {
          var origFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          var activeFetch = origFetch;
          if (origFetch) {
            var descriptor = {
              get: function() {
                return activeFetch;
              },
              set: function(fn) {
                activeFetch = fn;
              },
              configurable: true,
              enumerable: true
            };
            try {
              Object.defineProperty(window, 'fetch', descriptor);
            } catch (_) {}
            try {
              if (typeof Window !== 'undefined' && Window.prototype) {
                Object.defineProperty(Window.prototype, 'fetch', descriptor);
              }
            } catch (_) {}
          }
        } catch (_) {}
      })();
    </script>
